<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pembahasan Soal Evaluasi - CyberTech</title>
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="css/student.css">
  <link rel="stylesheet" href="css/quiz.css">
</head>
<body class="app-layout">

  <!-- Sidebar Navigasi Siswa -->
  <aside class="app-sidebar">
    <div class="sidebar-header">
      <a href="dashboard.html" class="navbar-brand">
        <img src="../assets/images/logo.svg" alt="CyberTech Logo" width="32" height="32">
        <span>CyberTech</span>
      </a>
    </div>

    <ul class="sidebar-menu">
      <li class="sidebar-item">
        <a href="dashboard.html">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
          <span>Beranda</span>
        </a>
      </li>
      <li class="sidebar-item">
        <a href="modules.html">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
          <span>Modul Pembelajaran</span>
        </a>
      </li>
      <li class="sidebar-item active">
        <a href="quiz-review.html">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>
          <span>Pembahasan Soal</span>
        </a>
      </li>
      <li class="sidebar-item">
        <a href="activity.html">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
          <span>Aktivitas & Hasil Kuis</span>
        </a>
      </li>
      <li class="sidebar-item">
        <a href="profile.html">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          <span>Profil</span>
        </a>
      </li>
    </ul>

    <div class="sidebar-footer">
      <button type="button" class="sidebar-logout-btn js-logout-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        <span>Logout</span>
      </button>
    </div>
  </aside>

  <!-- Area Konten Utama -->
  <div class="app-main">
    <header class="app-topbar">
      <div>
        <h2 style="font-size: 1.35rem; margin: 0; color: var(--color-primary);">Pembahasan Soal Evaluasi</h2>
        <div style="font-size: 0.85rem; color: var(--color-text-muted);" id="reviewSubtitle">Ulasan Komprehensif Soal, Kunci Jawaban & Konsep Keamanan Jaringan</div>
      </div>

      <div class="user-profile-badge">
        <div style="text-align: right;">
          <div class="font-semibold js-student-name" style="font-size: 0.95rem; color: var(--color-primary);">-</div>
          <div class="js-student-class" style="font-size: 0.8rem; color: var(--color-text-muted);">-</div>
        </div>
        <div class="user-avatar js-student-avatar">S</div>
      </div>
    </header>

    <main class="app-content">
      <div style="max-width: 880px; margin: 0 auto;">
        
        <!-- Bar Pemilih Modul & Status Sesi -->
        <div style="background: #ffffff; padding: 1rem 1.25rem; border-radius: var(--radius-md); border: 1px solid var(--color-border); margin-bottom: 1.5rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem; box-shadow: var(--shadow-sm);">
          <div style="display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap;">
            <label for="moduleSelector" style="font-weight: 700; color: var(--color-primary); margin: 0; font-size: 0.95rem; display: flex; align-items: center; gap: 6px;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
              <span>Pilih Modul:</span>
            </label>
            <select id="moduleSelector" class="form-select" style="width: auto; min-width: 280px; padding: 0.45rem 1rem;">
              <option value="1">Modul 1: Identifikasi Ancaman Jaringan</option>
              <option value="2">Modul 2: Analisis Sistem Keamanan Jaringan</option>
              <option value="3">Modul 3: Firewall &amp; Simulasi Paket</option>
            </select>
          </div>

          <div id="reviewBadgeStatus">
            <!-- Diisi lencana status riwayat kuis atau status belajar -->
          </div>
        </div>

        <!-- Header Info Pembahasan -->
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem; padding: 1.25rem; background: #ffffff; border-radius: var(--radius-md); border-left: 4px solid var(--color-accent); box-shadow: var(--shadow-sm);">
          <div>
            <h3 style="margin: 0 0 0.35rem 0; color: var(--color-primary);" id="reviewModuleTitle">Modul Pembelajaran</h3>
            <div style="font-size: 0.9rem; color: var(--color-text-muted);" id="reviewScoreSummary">Memuat pembahasan...</div>
          </div>
          <div style="display: flex; gap: 0.75rem; flex-wrap: wrap;">
            <a href="#" class="btn btn-outline btn-sm" id="btnBackToResult" style="display: none; align-items: center; gap: 5px;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
              <span>Kembali ke Skor</span>
            </a>
            <a href="#" class="btn btn-primary btn-sm" id="btnTakeQuiz" style="display: inline-flex; align-items: center; gap: 5px;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
              <span id="btnTakeQuizText">Kerjakan Kuis</span>
            </a>
          </div>
        </div>

        <!-- Container Daftar Soal & Pembahasan -->
        <div id="reviewQuestionsContainer">
          <!-- Diisi dinamis oleh script -->
        </div>

      </div>
    </main>
  </div>

  <!-- Scripts -->
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="js/student-common.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const currentUser = window.Auth ? window.Auth.getCurrentUser() : null;
      if (!currentUser) return;

      const urlParams = new URLSearchParams(window.location.search);
      const paramResultId = urlParams.get('id');
      const paramModuleId = urlParams.get('module');

      const moduleTitles = {
        '1': 'Identifikasi Ancaman Jaringan',
        '2': 'Analisis Sistem Keamanan Jaringan',
        '3': 'Firewall & Simulasi Paket'
      };

      const moduleSelector = document.getElementById('moduleSelector');
      const reviewModuleTitle = document.getElementById('reviewModuleTitle');
      const reviewScoreSummary = document.getElementById('reviewScoreSummary');
      const reviewBadgeStatus = document.getElementById('reviewBadgeStatus');
      const btnBackToResult = document.getElementById('btnBackToResult');
      const btnTakeQuiz = document.getElementById('btnTakeQuiz');
      const btnTakeQuizText = document.getElementById('btnTakeQuizText');
      const container = document.getElementById('reviewQuestionsContainer');

      // Ambil seluruh riwayat nilai siswa
      const studentResults = window.Storage.getResultsByStudent(currentUser.id) || [];

      // Tentukan modul awal dan riwayat target
      let targetModule = '1';
      let targetResult = null;

      if (paramResultId) {
        targetResult = window.Storage.getResultById(paramResultId);
        if (targetResult) {
          targetModule = String(targetResult.moduleId);
        } else if (studentResults.length > 0) {
          // Fallback ke hasil terbaru siswa
          targetResult = studentResults[0];
          targetModule = String(targetResult.moduleId);
        }
      } else if (paramModuleId) {
        targetModule = String(paramModuleId);
        targetResult = studentResults.find(r => String(r.moduleId) === targetModule) || null;
      } else {
        // Jika dibuka langsung dari menu sidebar, ambil hasil terbaru siswa jika ada
        if (studentResults.length > 0) {
          targetResult = studentResults[0];
          targetModule = String(targetResult.moduleId);
        }
      }

      moduleSelector.value = targetModule;

      function renderReview(moduleId, resultObj) {
        targetModule = String(moduleId);
        const modTitle = moduleTitles[targetModule] || `Modul ${targetModule}`;
        reviewModuleTitle.textContent = `Modul ${targetModule}: ${modTitle}`;

        btnTakeQuiz.href = `quiz.html?module=${targetModule}`;

        if (resultObj) {
          // Mode Review Hasil Evaluasi Siswa
          const isPass = resultObj.score >= 75;
          reviewScoreSummary.textContent = `Nilai Evaluasi Terakhir: ${resultObj.score} / 100 (${resultObj.correctCount} Benar, ${resultObj.wrongCount} Salah) • ${window.Utils.formatDate(resultObj.timestamp)}`;
          
          reviewBadgeStatus.innerHTML = isPass
            ? `<span class="badge badge-success" style="padding: 0.45rem 0.85rem; font-size: 0.85rem;">✓ TUNTAS KKM (${resultObj.score}/100)</span>`
            : `<span class="badge badge-danger" style="padding: 0.45rem 0.85rem; font-size: 0.85rem;">BELUM TUNTAS (< KKM: ${resultObj.score}/100)</span>`;

          btnBackToResult.style.display = 'inline-flex';
          btnBackToResult.href = `quiz-result.html?id=${resultObj.id}`;
          btnTakeQuizText.textContent = 'Ulangi Kuis Modul Ini';

          // Ambil soal yang diujikan pada sesi kuis ini
          const allQuizzes = window.Storage.getQuizzes(targetModule);
          const userAnswers = resultObj.userAnswers || {};
          const assignedIds = resultObj.assignedQuestionIds || Object.keys(userAnswers);
          const quizzes = assignedIds.length > 0 
            ? assignedIds.map(id => allQuizzes.find(q => q.id === id)).filter(Boolean)
            : allQuizzes;

          renderQuestionsList(quizzes, userAnswers, true);
        } else {
          // Mode Eksplorasi Pembahasan Soal Modul (Belum ada riwayat kuis)
          reviewScoreSummary.textContent = `Bank Pembahasan & Kunci Jawaban Lengkap (Panduan Belajar Mandiri)`;
          reviewBadgeStatus.innerHTML = `<span class="badge badge-info" style="padding: 0.45rem 0.85rem; font-size: 0.85rem;">Bank Pembahasan Aktif</span>`;
          
          btnBackToResult.style.display = 'none';
          btnTakeQuizText.textContent = 'Mulai Kuis Modul Ini';

          const quizzes = window.Storage.getQuizzes(targetModule);
          renderQuestionsList(quizzes, {}, false);
        }
      }

      function renderQuestionsList(quizzes, userAnswers, hasAttempt) {
        container.innerHTML = '';

        if (!quizzes || quizzes.length === 0) {
          container.innerHTML = `
            <div class="card text-center" style="padding: 3rem; color: var(--color-text-muted);">
              Belum ada butir soal untuk modul ini.
            </div>
          `;
          return;
        }

        quizzes.forEach((q, idx) => {
          const studentAns = userAnswers[q.id];
          const isCorrect = studentAns === q.kunci;

          const card = document.createElement('div');
          card.className = `review-question-card ${hasAttempt ? (isCorrect ? 'is-correct' : 'is-wrong') : ''}`;

          let badgeHtml = '';
          if (hasAttempt) {
            badgeHtml = isCorrect 
              ? `<span class="badge badge-success" style="display: inline-flex; align-items: center; gap: 4px;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg> Jawaban Anda Benar</span>` 
              : `<span class="badge badge-danger" style="display: inline-flex; align-items: center; gap: 4px;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="18" x2="18" y2="18"></line></svg> ${studentAns ? 'Jawaban Anda Salah' : 'Tidak Dijawab'}</span>`;
          } else {
            badgeHtml = `<span class="badge badge-info">Butir Soal #${idx + 1}</span>`;
          }

          // Render Opsi A, B, C, D
          let optionsHtml = '';
          ['A', 'B', 'C', 'D'].forEach(optKey => {
            let rowClass = 'review-option-row';
            let statusIndicator = '';

            if (hasAttempt) {
              if (optKey === studentAns && isCorrect) {
                rowClass += ' user-correct';
                statusIndicator = '<strong>(Pilihan Anda - Benar)</strong>';
              } else if (optKey === studentAns && !isCorrect) {
                rowClass += ' user-wrong';
                statusIndicator = '<strong>(Pilihan Anda - Salah)</strong>';
              } else if (optKey === q.kunci) {
                rowClass += ' official-key';
                statusIndicator = '<strong style="color: var(--color-success);">(Kunci Jawaban Resmi)</strong>';
              }
            } else {
              if (optKey === q.kunci) {
                rowClass += ' official-key';
                statusIndicator = '<strong style="color: var(--color-success);">(Kunci Jawaban Resmi)</strong>';
              }
            }

            optionsHtml += `
              <div class="${rowClass}">
                <div class="option-key-badge" style="width: 28px; height: 28px; font-size: 0.85rem;">${optKey}</div>
                <div style="flex: 1;">${q.opsi ? q.opsi[optKey] : ''}</div>
                <div>${statusIndicator}</div>
              </div>
            `;
          });

          card.innerHTML = `
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.85rem;">
              <div class="font-bold" style="color: var(--color-secondary);">Soal No. ${idx + 1}</div>
              <div>${badgeHtml}</div>
            </div>
            <div style="font-size: 1.05rem; font-weight: 600; color: var(--color-primary); margin-bottom: 1rem; line-height: 1.6;">
              ${q.pertanyaan}
            </div>
            <div class="review-options-list">
              ${optionsHtml}
            </div>
            <div class="explanation-box" style="margin-top: 1rem; background: #f0fdf4; border-left: 4px solid var(--color-success); padding: 1rem; border-radius: var(--radius-sm);">
              <div style="font-weight: 700; color: var(--color-primary); margin-bottom: 0.35rem; display: flex; align-items: center; gap: 0.5rem;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="9" y1="18" x2="15" y2="18"></line><line x1="10" y1="22" x2="14" y2="22"></line><path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14"></path></svg>
                <span>Pembahasan &amp; Analisis Konsep:</span>
              </div>
              <div style="color: var(--color-text-dark); line-height: 1.6;">${q.pembahasan || 'Pembahasan belum tersedia.'}</div>
            </div>
          `;

          container.appendChild(card);
        });
      }

      // Event Listener saat siswa mengganti modul pada dropdown
      moduleSelector.addEventListener('change', () => {
        const selectedMod = moduleSelector.value;
        const matchingResult = studentResults.find(r => String(r.moduleId) === String(selectedMod)) || null;
        renderReview(selectedMod, matchingResult);
      });

      // Render pertama
      renderReview(targetModule, targetResult);
    });
  </script>
</body>
</html>
