<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pembahasan Kuis Evaluasi - CyberTech</title>
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="css/student.css">
  <link rel="stylesheet" href="css/quiz.css">
</head>
<body class="app-layout">

  <!-- Sidebar Navigasi Siswa -->
  <aside class="app-sidebar">
    <div class="sidebar-header">
      <a href="dashboard.html" class="navbar-brand">
        <img src="../assets/images/logo.svg" alt="CyberTech Logo" width="32" height="32">
        <span>CyberTech</span>
      </a>
    </div>

    <ul class="sidebar-menu">
      <li class="sidebar-item">
        <a href="dashboard.html">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
          <span>Beranda</span>
        </a>
      </li>
      <li class="sidebar-item">
        <a href="modules.html">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
          <span>Modul Pembelajaran</span>
        </a>
      </li>
      <li class="sidebar-item active">
        <a href="activity.html">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
          <span>Aktivitas & Hasil Kuis</span>
        </a>
      </li>
      <li class="sidebar-item">
        <a href="profile.html">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          <span>Profil</span>
        </a>
      </li>
    </ul>

    <div class="sidebar-footer">
      <button type="button" class="sidebar-logout-btn js-logout-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        <span>Logout</span>
      </button>
    </div>
  </aside>

  <!-- Area Konten Utama -->
  <div class="app-main">
    <header class="app-topbar">
      <div>
        <h2 style="font-size: 1.35rem; margin: 0; color: var(--color-primary);">Lembar Pembahasan Kuis</h2>
        <div style="font-size: 0.85rem; color: var(--color-text-muted);" id="reviewSubtitle">Ulasan Soal & Kunci Jawaban</div>
      </div>

      <div class="user-profile-badge">
        <div style="text-align: right;">
          <div class="font-semibold js-student-name" style="font-size: 0.95rem; color: var(--color-primary);">-</div>
          <div class="js-student-class" style="font-size: 0.8rem; color: var(--color-text-muted);">-</div>
        </div>
        <div class="user-avatar js-student-avatar">S</div>
      </div>
    </header>

    <main class="app-content">
      <div style="max-width: 860px; margin: 0 auto;">
        
        <!-- Header Info Pembahasan -->
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem;">
          <div>
            <h3 style="margin: 0; color: var(--color-primary);" id="reviewModuleTitle">Modul Pembelajaran</h3>
            <div style="font-size: 0.9rem; color: var(--color-text-muted);" id="reviewScoreSummary">Nilai Perolehan: 0 / 100</div>
          </div>
          <div style="display: flex; gap: 0.75rem;">
            <a href="#" class="btn btn-outline btn-sm" id="btnBackToResult">← Kembali ke Skor</a>
            <a href="dashboard.html" class="btn btn-primary btn-sm">Ke Dashboard Siswa</a>
          </div>
        </div>

        <!-- Container Daftar Soal & Pembahasan (Layar 12: Container.png PRD) -->
        <div id="reviewQuestionsContainer">
          <!-- Diisi dinamis oleh script -->
        </div>

      </div>
    </main>
  </div>

  <!-- Scripts -->
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="js/student-common.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const resultId = urlParams.get('id');

      if (!resultId) {
        alert('Data evaluasi tidak ditemukan.');
        window.location.href = 'dashboard.html';
        return;
      }

      const result = window.Storage.getResultById(resultId);
      if (!result) {
        alert('Data evaluasi tidak ditemukan.');
        window.location.href = 'dashboard.html';
        return;
      }

      // Ambil soal yang sesuai dengan modul
      const quizzes = window.Storage.getQuizzes(result.moduleId);
      const userAnswers = result.userAnswers || {};

      document.getElementById('reviewModuleTitle').textContent = `Modul ${result.moduleId}: ${result.moduleTitle}`;
      document.getElementById('reviewScoreSummary').textContent = `Nilai Perolehan: ${result.score} / 100 (${result.correctCount} Benar, ${result.wrongCount} Salah)`;
      document.getElementById('btnBackToResult').href = `quiz-result.html?id=${result.id}`;

      const container = document.getElementById('reviewQuestionsContainer');
      container.innerHTML = '';

      quizzes.forEach((q, idx) => {
        const studentAns = userAnswers[q.id];
        const isCorrect = studentAns === q.kunci;

        const card = document.createElement('div');
        card.className = `review-question-card ${isCorrect ? 'is-correct' : 'is-wrong'}`;

        const badgeHtml = isCorrect 
          ? `<span class="badge badge-success">Jawaban Anda Benar ✓</span>` 
          : `<span class="badge badge-danger">Jawaban Anda Salah ✗</span>`;

        // Render Opsi A, B, C, D
        let optionsHtml = '';
        ['A', 'B', 'C', 'D'].forEach(optKey => {
          let rowClass = 'review-option-row';
          let statusIndicator = '';

          if (optKey === studentAns && isCorrect) {
            rowClass += ' user-correct';
            statusIndicator = '<strong>(Pilihan Anda - Benar)</strong>';
          } else if (optKey === studentAns && !isCorrect) {
            rowClass += ' user-wrong';
            statusIndicator = '<strong>(Pilihan Anda - Salah)</strong>';
          } else if (optKey === q.kunci) {
            rowClass += ' official-key';
            statusIndicator = '<strong style="color: var(--color-success);">(Kunci Jawaban Resmi)</strong>';
          }

          optionsHtml += `
            <div class="${rowClass}">
              <div class="option-key-badge" style="width: 28px; height: 28px; font-size: 0.85rem;">${optKey}</div>
              <div style="flex: 1;">${q.opsi[optKey]}</div>
              <div>${statusIndicator}</div>
            </div>
          `;
        });

        card.innerHTML = `
          <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.85rem;">
            <div class="font-bold" style="color: var(--color-secondary);">Soal No. ${idx + 1}</div>
            <div>${badgeHtml}</div>
          </div>
          <div style="font-size: 1.05rem; font-weight: 600; color: var(--color-primary); margin-bottom: 1rem; line-height: 1.6;">
            ${q.pertanyaan}
          </div>
          <div class="review-options-list">
            ${optionsHtml}
          </div>
          <div class="explanation-box">
            <div style="font-weight: 700; color: var(--color-primary); margin-bottom: 0.35rem; display: flex; align-items: center; gap: 0.5rem;">
              <span>💡 Pembahasan Soal:</span>
            </div>
            <div style="color: var(--color-text-dark);">${q.pembahasan || 'Pembahasan belum tersedia.'}</div>
          </div>
        `;

        container.appendChild(card);
      });
    });
  </script>
</body>
</html>
