<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Akun Siswa - CyberTech</title>
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body class="auth-page">

  <div class="auth-container">
    <a href="index.html" class="auth-back-link">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      Kembali ke Beranda
    </a>

    <div class="auth-brand">
      <a href="index.html">
        <img src="assets/images/logo.svg" alt="CyberTech Logo" width="40" height="40">
        <span>CyberTech</span>
      </a>
      <div class="auth-brand-subtitle">Multimedia Pembelajaran Keamanan Jaringan</div>
    </div>

    <div class="auth-card">
      <div class="auth-header">
        <h2 class="auth-title">Buat Akun Siswa</h2>
        <p class="auth-subtitle">Daftarkan akun untuk mulai mengakses materi dan kuis evaluasi.</p>
      </div>

      <!-- Form Registrasi Siswa (Sesuai Spesifikasi PRD Layar 4) -->
      <form id="registerForm" novalidate>
        <!-- 1. Nama Lengkap -->
        <div class="form-group">
          <label for="regNama" class="form-label">Nama Lengkap Siswa</label>
          <input 
            type="text" 
            id="regNama" 
            name="nama" 
            class="form-control" 
            placeholder="Contoh: Andi Pratama" 
            required 
            autocomplete="name"
          >
          <span class="form-error" id="namaError"></span>
        </div>

        <!-- 2. Email -->
        <div class="form-group">
          <label for="regEmail" class="form-label">Alamat Email</label>
          <input 
            type="email" 
            id="regEmail" 
            name="email" 
            class="form-control" 
            placeholder="Contoh: andi@smkn1takalar.sch.id" 
            required 
            autocomplete="email"
          >
          <span class="form-error" id="emailError"></span>
        </div>

        <!-- 3. Pilihan Tingkat Kelas (XI atau XII) -->
        <div class="form-group">
          <label for="regKelas" class="form-label">Pilih Tingkat Kelas (Jurusan TJKT)</label>
          <select id="regKelas" name="kelas" class="form-control" required style="cursor: pointer;">
            <optgroup label="Kelas XI (Tingkat 11)">
              <option value="XI TJKT 1" selected>Kelas XI (11) - XI TJKT 1</option>
              <option value="XI TJKT 2">Kelas XI (11) - XI TJKT 2</option>
            </optgroup>
            <optgroup label="Kelas XII (Tingkat 12)">
              <option value="XII TJKT 1">Kelas XII (12) - XII TJKT 1</option>
              <option value="XII TJKT 2">Kelas XII (12) - XII TJKT 2</option>
            </optgroup>
          </select>
          <span class="form-hint">Pilih tingkatan kelas Anda di SMK Negeri 1 Takalar.</span>
        </div>

        <!-- 4. Password -->
        <div class="form-group">
          <label for="regPassword" class="form-label">Kata Sandi</label>
          <input 
            type="password" 
            id="regPassword" 
            name="password" 
            class="form-control" 
            placeholder="Minimal 6 karakter" 
            required 
            autocomplete="new-password"
          >
          <span class="form-hint">Gunakan minimal 6 karakter kombinasi huruf dan angka.</span>
          <span class="form-error" id="passwordError"></span>
        </div>

        <!-- 4. Konfirmasi Password -->
        <div class="form-group">
          <label for="regConfirmPassword" class="form-label">Konfirmasi Kata Sandi</label>
          <input 
            type="password" 
            id="regConfirmPassword" 
            name="confirmPassword" 
            class="form-control" 
            placeholder="Ulangi kata sandi Anda" 
            required 
            autocomplete="new-password"
          >
          <span class="form-error" id="confirmError"></span>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" id="regSubmitBtn">
          Daftar Akun Sekarang
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </button>
      </form>

      <!-- Footer Tautan Login -->
      <div class="auth-footer">
        Sudah memiliki akun? <a href="login.html?role=siswa">Login di sini</a>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/utils.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('registerForm');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const nama = document.getElementById('regNama').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        const kelas = document.getElementById('regKelas').value;
        const password = document.getElementById('regPassword').value;
        const confirmPassword = document.getElementById('regConfirmPassword').value;

        // Reset semua error
        document.getElementById('namaError').textContent = '';
        document.getElementById('emailError').textContent = '';
        document.getElementById('passwordError').textContent = '';
        document.getElementById('confirmError').textContent = '';

        let hasError = false;

        if (!nama) {
          document.getElementById('namaError').textContent = 'Nama lengkap wajib diisi.';
          hasError = true;
        }

        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!email) {
          document.getElementById('emailError').textContent = 'Email wajib diisi.';
          hasError = true;
        } else if (!emailRegex.test(email)) {
          document.getElementById('emailError').textContent = 'Format email tidak valid.';
          hasError = true;
        }

        if (!password) {
          document.getElementById('passwordError').textContent = 'Kata sandi wajib diisi.';
          hasError = true;
        } else if (password.length < 6) {
          document.getElementById('passwordError').textContent = 'Kata sandi minimal 6 karakter.';
          hasError = true;
        }

        if (!confirmPassword) {
          document.getElementById('confirmError').textContent = 'Konfirmasi kata sandi wajib diisi.';
          hasError = true;
        } else if (password !== confirmPassword) {
          document.getElementById('confirmError').textContent = 'Konfirmasi kata sandi tidak cocok.';
          hasError = true;
        }

        if (hasError) return;

        const submitBtn = form.querySelector('button[type="submit"]');
        const origBtnText = submitBtn.textContent;
        submitBtn.disabled = true;
        submitBtn.textContent = 'Mendaftarkan Akun...';

        try {
          // Proses registrasi via Auth helper (tersinkron otomatis ke MySQL jika server aktif)
          const result = await window.Auth.registerStudent(nama, email, password, confirmPassword, kelas);
          if (result.success) {
            window.Utils.showToast('Akun berhasil dibuat! Mengalihkan ke Dashboard Siswa...', 'success', 2500);
            setTimeout(() => {
              window.location.href = 'student/dashboard.html';
            }, 800);
          } else {
            window.Utils.showToast(result.message, 'error', 4000);
            document.getElementById('emailError').textContent = result.message;
            submitBtn.disabled = false;
            submitBtn.textContent = origBtnText;
          }
        } catch (err) {
          submitBtn.disabled = false;
          submitBtn.textContent = origBtnText;
        }
      });
    });
  </script>
</body>
</html>
